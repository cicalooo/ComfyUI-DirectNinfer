name: test

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest ruff build numpy Pillow psutil
      - name: Test
        run: python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Compile Python
        run: python -m compileall -q .
      - name: Check JavaScript syntax
        shell: bash
        run: node --check web/amp_ninfer.js
      - name: Build distributions
        run: python -m build
